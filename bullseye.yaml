  T2.5:
    name: Movement window excludes 09:00; WorkManager delays are inexact
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - unit test with injected clock at 09:00:00 expects a
    - notification (or a `shouldNotify` helper returning true).
    - 'ENT-005 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-005 (P2). Status: observed fact (09:00 skip); inference (Doze lateness). documented 9am reminder can never fire on time even if WorkManager runs at 09:00:00. Inexact work on API 31+ can also slip bedtime/wind-down past the intended minute. Follow-up delay shortens by the time between the two `now()` calls (usually negligible). Remediation: notify on `!now.isBefore(workStart)` (inclusive 09:00). Pass a single `now` into delay math. Decide whether exact alarms are worth `SCHEDULE_EXACT_ALARM` for a personal app. Blast: four reminder channels; owner-visible missed 9am stand-up. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-005
    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T2.6:
    name: Android 12+ backup ignores `backup_rules.xml`
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - lint `DataExtractionRules` warning gone; optional
    - restore test with a v1 fixture DB.
    - 'ENT-006 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-006 (P2). Status: observed fact. on the devices this app actually runs on (API 31+), the explicit include file does not govern device-to-device transfer or the new backup schema. Defaults still back up databases, so data is not silently dropped, but include/exclude intent is unenforced. A future schema bump plus cloud restore can land vN data on vN+1 without a tested path (`onUpgrade` only handles `oldVersion < 2`, `app/src/main/java/com/marcelo/protocol/data/ProtocolDatabase.kt:57-65`). Remediation: add `@xml/data_extraction_rules` mirroring the include of `protocol.db`, set `android:dataExtractionRules`. Keep `fullBackupContent` for API 29–30. Blast: sole copy of habit history (`protocol.db`). Personal app, one user — still the only dataset. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-006
    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
