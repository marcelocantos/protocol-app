    - 'ENT-001 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-001 (P1). Status: observed fact. Load-bearing properties (schema v1→v2 rewrite, `checklistFor` per day type, `unplannedDays`, `delayUntil` wrap-past-midnight, gym weekly count, schedule default-merge) have no oracle. CI stays green while those functions regress. A `NO-SOURCE` test task is success-shaped failure. Remediation: add `src/test` with JVM tests for `checklistFor`, `ScheduleRepository` default-merge, `PlanningRepository.unplannedDays`, `ProtocolDatabase.onUpgrade` against `SQLiteDatabase.create(null)` or Robolectric, and `NotificationScheduler.delayUntil` with a clock seam. Then add… Blast: every future behavior change, including 🎯T1 and ENT-002. Personal-use does not shrink the set of untested invariants. Report: docs/audits/entropy-audit-2026-08-22.md.'
