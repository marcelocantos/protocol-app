    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T2.2:
    name: '`schedule` and `week_plans` both claim “day type for this date”'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - given default Tue=WFH and a week-plan Tue=OFFICE,
    - Today’s `dayType` for that date is OFFICE; a unit test fails if Today
    - consults `schedule` alone.
    - 'ENT-002 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-002 (P1). Status: observed fact (split); inference (user-visible wrong checklist). Two tables store a `DayType` for a calendar day. Plan can mark next Tuesday OFFICE (and book parking) while `schedule` still says WFH. When that Tuesday arrives, Today still shows the WFH checklist. A bugfix to “what items appear on a planned office day” must be repeated in Today, Week, and Plan or it will drift again. Remediation: one function `effectiveDayType(date, schedule, weekPlan)` used by Today, Week, Plan, and `PlanningReminderWorker`. If Plan is parking-only, stop storing `day_type` overrides and drive Plan chips from `schedule`. Blast: Today checklist composition, Week 7-day percentages, gym-day presence, parking reminders vs actual day type. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-002
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T2.3:
    name: Per-instance repositories and Week not observing completions
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'instrumented or Robolectric test: toggle gym on Today,'
    - collect `WeekViewModel.gymCount`, assert increment without recreating
    - 'the VM. Second test: change Monday type on Week, assert Today’s'
    - '`dayType` for a Monday updates.'
    - 'ENT-003 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-003 (P1). Status: observed fact. SQLite is shared; observers are not. The repository pattern is instantiated as a cache without a shared owner. Tab switches look like they should show fresh data because the VM still exists. Remediation: construct `ScheduleRepository` and `PlanningRepository` once on `ProtocolApp` (or a tiny holder) and add a completions refresh signal (or `callbackFlow` on DB writes) that Week and Today both collect. Do not introduce Hilt solely for this. Blast: Week gym count and last-7-day percentages after Today toggles; Today day type after Week schedule edits, until a date change retriggers `flatMapLatest`. Report: docs/audits/entropy-audit-2026-08-22.md.'
